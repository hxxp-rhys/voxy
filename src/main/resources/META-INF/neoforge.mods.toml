modLoader="javafml"
loaderVersion="[4,)"
license="All-Rights-Reserved"
issueTrackerURL="https://github.com/MCRcortex/voxy/issues"

[[mods]]
modId="voxy"
version="${version}"
displayName="Voxy"
description="Far distance rendering mod utilising LoDs"
authors="Cortex"
logoFile="assets/voxy/icon.png"

[[dependencies.voxy]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# Sodium is a hard requirement on the client only; a dedicated server runs Voxy without it.
[[dependencies.voxy]]
modId="sodium"
type="required"
versionRange="[0.8.12,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.voxy]]
modId="iris"
type="optional"
reason="Enables Voxy LOD terrain in Iris shader pipelines (shader packs shipping voxy.json)"
versionRange="[1.8.14-beta.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.voxy]]
modId="chunky"
type="optional"
reason="Chunks pre-generated by Chunky are ingested into the LOD database"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.voxy]]
modId="lithium"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

# Upstream declares `breaks voxyworldgenv2 =2.2.2`
[[dependencies.voxy]]
modId="voxyworldgenv2"
type="incompatible"
reason="Voxy World Gen V2 2.2.2 is incompatible with this Voxy version; use 2.4.2 or newer"
versionRange="[2.2.2]"
ordering="NONE"
side="BOTH"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="common.voxy.mixins.json"

[[mixins]]
config="iris.voxy.mixins.json"

[[mixins]]
config="worldgen.voxy.mixins.json"

[[mixins]]
config="chunky.voxy.mixins.json"

# Sodium instantiates this class as a ConfigEntryPoint (read by ConfigLoaderForge), giving Voxy
# its own page inside Sodium's video settings - the NeoForge equivalent of the
# "sodium:config_api_user" entrypoint declared in fabric.mod.json upstream.
[modproperties.voxy]
"sodium:config_api_user" = "me.cortex.voxy.client.config.VoxyConfigMenu"
commit = "${commit}"
buildtime = "${buildtime}"
