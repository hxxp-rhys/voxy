# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# ---- NeoForge 1.21.1 port ----
minecraft_version=1.21.1
neoforge_version=21.1.248
# ModDevGradle (NeoForge's official Gradle plugin)
moddev_version=2.0.42-beta
# Parchment parameter names (does not change class/member names; mojmap stays authoritative)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Sodium for NeoForge 1.21.1. The Modrinth/CaffeineMC "sodium-neoforge" artifact is a thin loader
# shell whose real classes live in the nested "-mod" jar, so we compile against the -mod and -api
# artifacts and put the real distribution jar on the runtime classpath for dev runs.
sodium_version=0.8.13+mc1.21.1
sodium_modrinth_version=mc1.21.1-0.8.13-neoforge

# Optional integrations (compileOnly)
iris_version=1.8.14-beta.1+1.21.1-neoforge
lithium_version=mc1.21.1-0.15.4-neoforge
# Chunky NeoForge 1.4.23 (Modrinth version id, unambiguous across loaders)
chunky_version=LuFhm4eU

# Mod Properties
mod_version=0.2.19-beta
maven_group=me.cortex
archives_base_name=voxy
