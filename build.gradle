plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ---------------------------------------------------------------------------------------------
// Repositories
// ---------------------------------------------------------------------------------------------
repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "caffeinemcRepository"
                url = "https://maven.caffeinemc.net/releases"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Build metadata (version / commit / build time) - exposed to the mod through
// META-INF/neoforge.mods.toml and the generated voxy-build.properties resource.
// ---------------------------------------------------------------------------------------------
def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }
        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>"
        } else {
            return result.standardOutput.asText.get().strip()
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>"
    }
}

def buildtime = { System.currentTimeSeconds() }

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def ver = project.version
    def props = ["version": ver, "commit": hash, "buildtime": time,
                 "minecraft_version": project.minecraft_version,
                 "neoforge_version": project.neoforge_version]

    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(props)
    }

    // Generated build descriptor read by me.cortex.voxy.commonImpl.PlatformUtil
    doLast {
        def out = new File(destinationDir, "voxy-build.properties")
        out.text = "version=${ver}\ncommit=${hash}\nbuildtime=${time}\n"
    }
}

// ---------------------------------------------------------------------------------------------
// NeoForge / ModDevGradle
// ---------------------------------------------------------------------------------------------
neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    // Fail the build on AT entries whose descriptor matches no member (those would otherwise
    // silently do nothing at runtime).
    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        voxy {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty('neoforge.enabledGameTestNamespaces', 'voxy')
            // ./gradlew runClient -PquickPlay=<world folder name> jumps straight into an existing singleplayer world
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument('--nogui')
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------------------------
project.ext.lwjglVersion = "3.3.3" // LWJGL version shipped with Minecraft 1.21.1

configurations {
    // Native library jars downloaded only to be unpacked into the mod jar root (see extractLwjglNatives)
    lwjglNativesRaw
}

dependencies {
    // Sodium (required, client). Compile against the real classes (-mod) and the public API (-api).
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${project.sodium_version}"
    compileOnly "net.caffeinemc:sodium-neoforge-api:${project.sodium_version}"
    // Dev runs: ModDevGradle only places NeoForge's libraries and this configuration on the run classpath (the
    // jar-in-jar libraries below are NOT there automatically), so the bundled libraries are listed here as well.
    // External mods (Sodium, Iris, Lithium, Chunky, Voxy World Gen V2) are loaded from run/<client|server>/mods
    // like in production; see docs/PORTING-NOTES.md for how the smoke-test run directories are populated.
    additionalRuntimeClasspath 'org.rocksdb:rocksdbjni:10.2.1'
    additionalRuntimeClasspath 'redis.clients:jedis:5.1.0'
    additionalRuntimeClasspath 'org.apache.commons:commons-pool2:2.12.0'
    additionalRuntimeClasspath 'org.tukaani:xz:1.10'
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Optional integrations - compile only
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:lithium:${project.lithium_version}"
    compileOnly "maven.modrinth:chunky:${project.chunky_version}"

    // LWJGL: core is provided by Minecraft; the LMDB and ZSTD bindings are not.
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    jarJar(implementation("org.lwjgl:lwjgl-lmdb:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    jarJar(implementation("org.lwjgl:lwjgl-zstd:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    // Dev runtime needs the bindings + natives on the classpath as plain jars
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
    // Native binaries repackaged into the mod jar root (LWJGL's SharedLibraryLoader finds them there)
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    // Storage backends and importers (bundled as jar-in-jar; identical versions to upstream)
    jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1')) {
        version { strictly '[10.0.0,11.0.0)'; prefer '10.2.1' }
    }
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        version { strictly '[5.0.0,6.0.0)'; prefer '5.1.0' }
    }
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0')) {
        version { strictly '[2.11.0,3.0.0)'; prefer '2.12.0' }
    }
    jarJar(implementation('org.tukaani:xz:1.10')) {
        version { strictly '[1.9,2.0)'; prefer '1.10' }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0')) {
        version { strictly '[3.40.0.0,4.0.0.0)'; prefer '3.49.1.0' }
    }
    // lz4-java 1.8.0 is shipped by Minecraft itself (used for region compression) - compile only
    compileOnly 'org.lz4:lz4-java:1.8.0'
}

// ---------------------------------------------------------------------------------------------
// Java
// ---------------------------------------------------------------------------------------------
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

// ---------------------------------------------------------------------------------------------
// LWJGL natives: unpack the .dll/.so files into the jar root so LWJGL can load them from the
// mod jar (the nested natives jars are not on the module path at runtime).
// ---------------------------------------------------------------------------------------------
def extractedNativesDir = layout.buildDirectory.dir("extracted-natives")

tasks.register('extractLwjglNatives') {
    description = 'Extracts native binaries from the LWJGL lmdb/zstd natives jars for bundling'
    group = 'build'
    inputs.files(configurations.lwjglNativesRaw)
    outputs.dir(extractedNativesDir)
    doLast {
        def outputDir = extractedNativesDir.get().asFile
        outputDir.mkdirs()
        configurations.lwjglNativesRaw.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            // LWJGL 3.3.3 Library.findResource first asks the classloader for the bundled path
            // (<os>/<arch>/org/lwjgl/<module>/<lib>) and then for the bare library name at the root
            // (javap org.lwjgl.system.Library.findResource: getBundledPath -> getResource, then
            // getResource(libName)). Ship both layouts: the structured one is LWJGL's primary lookup,
            // the flat one is what the previous production NeoForge port relied on.
            copy {
                from(zipTree(artifact.file)) {
                    include '**/*.dll'
                    include '**/*.so'
                    includeEmptyDirs = false
                }
                into outputDir
            }
            copy {
                from(zipTree(artifact.file)) {
                    include '**/*.dll'
                    include '**/*.so'
                    eachFile { fcp -> fcp.relativePath = new RelativePath(true, fcp.name) }
                    includeEmptyDirs = false
                }
                into outputDir
            }
        }
    }
}

jar {
    dependsOn 'extractLwjglNatives'
    from(extractedNativesDir)
    from("LICENSE.md") {
        rename { "${it}_${project.archives_base_name}" }
    }
    if (!isInGHA) {
        def hash = gitCommitHash()
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash.substring(0, 7))
        }
    }
}

// ---------------------------------------------------------------------------------------------
// slimJar - platform-trimmed distribution jars.
//
// rocksdbjni and sqlite-jdbc ship natives for every platform (~80 MB). This task rewrites the
// nested jar-in-jar entries keeping only the natives for the requested platforms, and (by
// default) strips module-info.class from the LWJGL binding jars: those are explicit JPMS modules
// with `requires transitive org.lwjgl`, and FML resolves the game module layer eagerly - a
// dedicated server (which ships no LWJGL core) would otherwise die at boot with
// "Module org.lwjgl not found, required by org.lwjgl.lmdb".
//
//   ./gradlew slimJar                                   # win64 + linux64 (user's client + server)
//   ./gradlew slimJar -PslimPlatforms=win64,windows     # windows only
//   -PslimStripModuleInfo=                              # disable descriptor stripping
// ---------------------------------------------------------------------------------------------
tasks.register('slimJar') {
    group = 'build'
    description = 'Builds a jar with non-target-platform natives stripped from bundled libraries'
    dependsOn tasks.named('jar')

    def platforms = ((project.findProperty('slimPlatforms') ?: 'win64,windows,linux64,linux') as String)
            .split(',').collect { it.trim().toLowerCase() }.findAll { it }
    def excludes = ((project.findProperty('slimExclude') ?: 'musl,aarch64,arm64,ppc64le,s390x,riscv64,linux32,osx,mac') as String)
            .split(',').collect { it.trim().toLowerCase() }.findAll { it }
    def stripModuleInfo = ((project.findProperty('slimStripModuleInfo') ?: 'lwjgl-lmdb,lwjgl-zstd') as String)
            .split(',').collect { it.trim().toLowerCase() }.findAll { it }
    def sourceJar = tasks.named('jar').flatMap { it.archiveFile }
    def targetFile = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}-neoforge-1.21.1-slim.jar")

    inputs.file(sourceJar)
    inputs.property('platforms', platforms)
    inputs.property('excludes', excludes)
    inputs.property('stripModuleInfo', stripModuleInfo)
    outputs.file(targetFile)

    doLast {
        def trimmable = ~/^META-INF\/jarjar\/(rocksdbjni|sqlite-jdbc|lwjgl-lmdb|lwjgl-zstd)-.*\.jar$/
        def isNative = { String n -> n.endsWith('.so') || n.endsWith('.dll') || n.endsWith('.jnilib') || n.endsWith('.dylib') }
        def keepNative = { String n ->
            def l = n.toLowerCase()
            platforms.any { l.contains(it) } && !excludes.any { l.contains(it) }
        }

        long dropped = 0
        int droppedCount = 0
        int strippedDescriptors = 0

        def trim = { String nestedName, byte[] nested ->
            def stripThis = stripModuleInfo.any { nestedName.toLowerCase().contains(it) }
            def bout = new ByteArrayOutputStream()
            new java.util.zip.ZipOutputStream(bout).withCloseable { zout ->
                new java.util.zip.ZipInputStream(new ByteArrayInputStream(nested)).withCloseable { zin ->
                    def e
                    while ((e = zin.nextEntry) != null) {
                        byte[] data = zin.readAllBytes()
                        if (isNative(e.name) && !keepNative(e.name)) {
                            dropped += data.length
                            droppedCount++
                            continue
                        }
                        if (stripThis && e.name.endsWith('module-info.class')) {
                            strippedDescriptors++
                            continue
                        }
                        def ne = new java.util.zip.ZipEntry(e.name)
                        ne.time = 0
                        zout.putNextEntry(ne)
                        zout.write(data)
                        zout.closeEntry()
                    }
                }
            }
            return bout.toByteArray()
        }

        def src = sourceJar.get().asFile
        def dst = targetFile.get().asFile
        dst.parentFile.mkdirs()

        new java.util.zip.ZipOutputStream(dst.newOutputStream()).withCloseable { zout ->
            new java.util.zip.ZipInputStream(src.newInputStream()).withCloseable { zin ->
                def entry
                while ((entry = zin.nextEntry) != null) {
                    byte[] data = zin.readAllBytes()
                    if (entry.name ==~ trimmable) {
                        data = trim(entry.name, data)
                    }
                    def ne = new java.util.zip.ZipEntry(entry.name)
                    ne.time = 0
                    zout.putNextEntry(ne)
                    zout.write(data)
                    zout.closeEntry()
                }
            }
        }

        logger.lifecycle("slimJar: kept platforms ${platforms}, excluded ${excludes}")
        if (strippedDescriptors) logger.lifecycle("slimJar: stripped ${strippedDescriptors} module-info descriptor(s) from ${stripModuleInfo}")
        logger.lifecycle("slimJar: dropped ${droppedCount} native libraries (${(dropped / 1024 / 1024) as int} MB uncompressed)")
        logger.lifecycle("slimJar: ${src.length() / 1024 / 1024 as int} MB -> ${dst.length() / 1024 / 1024 as int} MB  (${dst.name})")
    }
}
